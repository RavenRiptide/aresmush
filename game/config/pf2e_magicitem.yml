    shortdesc: "This polished crystal sphere enhances scrying magic. Any visual information received through a spell with the scrying trait that was cast by the *crystal ball* appears within the sphere, and any auditory information sounds out from the surface of the sphere. When you cast a spell with the scrying trait by any other means while holding the sphere, you can relay any information you receive in the same way, allowing others to see or hear the target.%r%r**Activate--Clairvoyance** 1 minute (concentrate, manipulate); **Frequency** once per hour; **Effect** The *crystal ball* casts *clairvoyance* to your specifications.%r%r**Activate--Scrying** 10 minutes (concentrate, manipulate); **Frequency** twice per day; **Effect** The *crystal ball* casts a DC 41 Will *scrying* spell to your specifications, with the benefits of *truesight* for anything you watch through it."
