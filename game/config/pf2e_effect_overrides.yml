---
# Effects as kept by hand over the ones imported from Foundry. `pf2e_effects.yml` is replaced whole on each
# import, so whatever the import gets wrong is put right here, and `ActiveEffects.info` lays it over the
# imported entry:
#
#   duration   merged over the imported duration; only the keys given change, so a `unit` and `value`
#              here keep the import's `expiry`
#   rules      a list merged over the imported rules by position: the first entry over the first rule, and
#              so on. An empty hash leaves that rule as it is.
#
# Foundry leaves most "until your next daily preparations" effects unlimited, and most one-off bonuses for
# the player to delete. Here a rest ends the first (`unit: days, value: 1` lasts until the next rest), and
# `removeAfterRoll` ends the second.
pf2e_effect_overrides:
  # Hunt Prey: "Your designation lasts until your next daily preparations."
  "Effect: Hunt Prey":
    duration:
      unit: days
      value: 1
  # Root Magic: "The first time that day the ally attempts a saving throw against a spell or haunt."
  # The bonus counted in that save, so the save spends it.
  "Effect: Root Magic":
    rules:
      - removeAfterRoll: if-enabled
