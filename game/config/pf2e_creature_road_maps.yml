# GM Core's base road maps (p. 112): the band of each figure a role names; any other is moderate.
# Written by scripts/import_creature_benchmarks.py from Archives of Nethys ("Base Road Maps") on 2026-10-20;
# run it again rather than editing by hand. Where the book offers two bands, the first is taken.
pf2e_creature_road_maps:
  "Brute":
    says: "low Perception; high or extreme Str modifier, high to moderate Con modifier, low or lower Dex and mental modifiers; moderate or low AC; high Fortitude, low Reflex or Will or both; high HP; high attack bonus and high damage or moderate attack bonus and extreme damage"
    bands: { perception: "low", attribute.str: "high", attribute.con: "high", attribute.dex: "low", attribute.int: "low", attribute.wis: "low", attribute.cha: "low", ac: "moderate", save.fortitude: "high", save.reflex: "low", hp: "high", strike_attack: "high", strike_damage: "high" }
  "Magical Striker":
    says: "high attack and high damage; moderate to high spell DCs; either a scattering of innate spells, or prepared or spontaneous spells with a rank up to half the creature's level (rounded up) minus 1"
    bands: { strike_attack: "high", strike_damage: "high", spell: "moderate" }
  "Skill Paragon":
    says: "high or extreme attribute modifier matching its best skills; typically high Reflex or Will and low Fortitude; many skills at moderate or high and potentially one or two extreme skills; at least one special ability to use the creature's skills in combat"
    bands: { save.reflex: "high", save.fortitude: "low" }
  "Skirmisher":
    says: "high Dex modifier; low Fortitude, high Reflex; higher Speed than typical"
    bands: { attribute.dex: "high", save.fortitude: "low", save.reflex: "high" }
  "Sniper":
    says: "high Perception; high Dex modifier; low Fortitude, high Reflex; moderate to low HP; ranged Strikes have high attack bonus and damage or moderate attack bonus and extreme damage (melee Strikes are weaker)"
    bands: { perception: "high", attribute.dex: "high", save.fortitude: "low", save.reflex: "high", hp: "moderate", strike_attack: "high", strike_damage: "high", ranged: true }
  "Soldier":
    says: "high Str modifier; high to extreme AC; high Fortitude; high attack bonus and high damage; Reactive Strike or other tactical abilities"
    bands: { attribute.str: "high", ac: "high", save.fortitude: "high", strike_attack: "high", strike_damage: "high" }
  "Spellcaster":
    says: "high or extreme modifier for the spellcasting attribute; low Fortitude, high Will; low HP; low attack bonus and moderate or low damage; high or extreme spell DCs; prepared or spontaneous spells with a rank of up to half the creature's level (rounded up)"
    bands: { save.fortitude: "low", save.will: "high", hp: "low", strike_attack: "low", strike_damage: "moderate", spell: "high" }
